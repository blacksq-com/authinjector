# ── NOT IN THIS CATALOGUE, and why ──────────────────────────────────────────
#
# These are credentials, but not ones a header-or-query injecting proxy can
# carry. Listing them here would promise a capability that does not exist.
#
#   CLOUDFLARE_R2_ACCESS_ID / _SECRET_KEY
#       S3 SigV4. The secret is an input to a request SIGNATURE computed over
#       method, path, headers and payload hash -- there is no field to inject
#       it into. Brokering R2 needs the broker to sign, which is a different
#       feature from injection.
#
#   DOCUSEAL_WEBHOOK_SECRET
#       Verifies INCOMING webhooks. It never travels outbound, so there is
#       nothing to proxy. It belongs in the receiving worker's own secrets.
#
#   GOOGLE_OAUTH_SECRET / GOOGLE_OAUTH_ID_BLACKSQ
#       An OAuth client credential used in a browser redirect flow, exchanged
#       at a token endpoint for a user's token. The broker could carry the
#       token exchange, but the flow as a whole is not a proxied API call.
#
#   STRIPE_SENDBOX_PUBLISHABLEKEY
#       Publishable by design -- it ships in client-side code and is not a
#       secret.
#
#   CLOUDFLARE_ACCOUNT_ID, CLIO_DEV_CLIENT_ID
#       Identifiers, not credentials. They belong in ordinary config.
#
#   GOOGLE_BUSINESS_PROFILE
#       Removed after testing, not theorised. It was in this catalogue as a
#       bearer-token service; the live API answered:
#
#         401 "Request had invalid authentication credentials.
#              Expected OAuth 2 access token"
#
#       The Business Profile APIs take a short-lived OAuth 2 user token, minted
#       per request from a refresh token. A static credential cannot satisfy
#       them, so a catalogue entry here would promise something that can never
#       work. Same category as GOOGLE_OAUTH_SECRET above. If GBP is needed, the
#       broker would have to learn to mint tokens from a refresh token, which
#       is a feature, not an entry.
#
#       🔴 THAT FEATURE NOW EXISTS (2026-10-05). `auth_in = "google_sa"` mints
#       an access token from a held service-account key -- see [services.gsc]
#       above and src/gtoken.rs. GBP is still not entered here, but only
#       because nobody has needed it: the obstacle this note describes is gone,
#       and a GBP entry is now an ordinary entry. GBP uses per-USER OAuth
#       rather than a service account for most scopes, so check which grant
#       the needed endpoint takes before adding one.
