# AuthInjector service catalogue.
#
# PUBLIC. Ships with the install, contains no secret and no permission --
# only the mechanical knowledge of how to talk to each service, which is
# identical for everyone who uses it.
#
#   authinjector list                what is here
#   authinjector catalogue update    pull the latest
#
# Your keys and access rules live in /etc/authinjector/config.toml, which is
# private and never leaves your machine. One service may hold SEVERAL keys,
# labelled -- see that file.
#
# 🔴 base_url, auth_header and auth_param decide WHERE a credential is sent and
# in which field. A tampered catalogue would redirect your keys while every
# audit line still looked ordinary. Updates are signature-verified, and a
# change to a service you already have configured is shown as a diff and waits
# for you.
#
# auth_in = "header"  -> sent as `auth_header: <prefix><key>`
# auth_in = "query"   -> appended as `?<auth_param>=<key>`
#
# 🔴 A QUERY-PARAM CREDENTIAL IS WEAKER AND IS MARKED AS SUCH. It travels in
# the URL, so it reaches the upstream's access logs and any proxy in between.
# We strip it from OUR audit log, but we cannot strip it from theirs. Prefer a
# header whenever a service offers both.

# ── Research and data ───────────────────────────────────────────────────────

# ── Google, via a service account ───────────────────────────────────────────
#
# 🔴 THESE ARE NOT STATIC-KEY SERVICES. `auth_in = "google_sa"` means the key
# this broker holds is a Google SERVICE-ACCOUNT JSON, and the broker signs an
# assertion with it and injects the short-lived access token Google returns.
# The caller never sees the private key and never sees the token. See
# src/gtoken.rs for why this had to be a feature rather than a catalogue entry,
# and the Business Profile note further down for how long it was not possible.
#
# The service account is granted access per-property INSIDE the Google product
# -- for Search Console that is Settings → Users and permissions → Add user,
# with its …iam.gserviceaccount.com address and "Restricted". Nothing is
# granted by holding the key here.

[services.gsc]
name = "Google Search Console"
base_url = "https://searchconsole.googleapis.com"
auth_in = "google_sa"
auth_scope = "https://www.googleapis.com/auth/webmasters.readonly"
signup_url = "https://console.cloud.google.com/apis/library/searchconsole.googleapis.com"
cost_per_call_cad = 0.0
endpoints = [
  # Search Analytics: clicks, impressions, position by page/query/date.
  # 25,000 rows a request, paginated with startRow -- the reason to use the API
  # at all rather than the 1,000-row console export.
  { methods = ["POST"], path_prefix = "/webmasters/v3/sites/" },
  # Which properties this service account can see.
  { methods = ["GET"], path_prefix = "/webmasters/v3/sites" },
  # URL Inspection: is a given URL indexed, and why not.
  { methods = ["POST"], path_prefix = "/v1/urlInspection/index:inspect" },
  { methods = ["GET"], path_prefix = "/v1/sites" },
]

[services.tavily]
name = "Tavily"
base_url = "https://api.tavily.com"
auth_in = "header"
auth_header = "Authorization"
auth_prefix = "Bearer "
signup_url = "https://tavily.com/"
cost_per_call_cad = 0.008
endpoints = [
  { methods = ["POST"], path_prefix = "/search" },
  { methods = ["POST"], path_prefix = "/extract" },
]

[services.outscraper]
name = "Outscraper"
base_url = "https://api.outscraper.cloud"
auth_in = "header"
auth_header = "X-API-KEY"
signup_url = "https://outscraper.com/"
endpoints = [
  { methods = ["GET"], path_prefix = "/maps/search" },
  { methods = ["GET"], path_prefix = "/maps/reviews" },
  { methods = ["GET"], path_prefix = "/profile" },
]

[services.realvalidation]
name = "RealValidation (phone scrub)"
base_url = "https://api.realvalidation.com"
auth_in = "query"
auth_param = "token"
signup_url = "https://realvalidation.com/"
# 🔴 THE TRAILING SLASH IS LOAD-BEARING. `/rpvWebService` without it answers
# 301 to the canonical `/rpvWebService/` -- over **http**, with the query string
# echoed into Location, credential included. We never follow redirects, and the
# response headers are now scrubbed, so nothing leaked; requiring the slash here
# means the bare form is refused by policy instead of producing that redirect at
# all. The live endpoint is the Turbo PHP script beneath it.
endpoints = [{ methods = ["GET"], path_prefix = "/rpvWebService/" }]

