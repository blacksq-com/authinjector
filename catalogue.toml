[services.grok-imagine]
name = "xAI Grok Imagine"
base_url = "https://api.x.ai"
auth_in = "header"
auth_header = "Authorization"
auth_prefix = "Bearer "
signup_url = "https://console.x.ai/"
# Video generation. Added 2026-10-01, after OpenAI retired the Videos API and
# sora-2/sora-2-pro on 2026-09-24 with no replacement (they still show in
# GET /v1/models, which is stale metadata, not capability).
#
# 🔴 VIDEO BILLS PER SECOND OF OUTPUT. From xAI's own models page:
#     grok-imagine-video       $0.050 / sec   (classic)
#     grok-imagine-video-1.5   $0.080 / sec   (adds 1080p, last_frame, keyframes)
#     grok-imagine-image-2.0   $0.04  / image
# `duration` accepts 1-15s, so a single careless call spans 5c to $1.20, and a
# retry loop pays it again every pass. ONE short test render, look at it, then
# the keeper. The CA$269 incident was a cheaper SKU than this.
#
# Defaults worth knowing: `resolution` defaults to 480p (1080p is v1.5 only)
# and `generate_audio` defaults to TRUE — a muted hero loop does not want
# audio, so pass false and stop paying to synthesise a soundtrack nobody hears.
endpoints = [
  # Free liveness check, same role /v1/models plays for openai: answers "is
  # this key live" without generating anything.
  { methods = ["GET"], path_prefix = "/v1/api-key" },
  { methods = ["GET"], path_prefix = "/v1/models" },
  { methods = ["POST"], path_prefix = "/v1/images/generations" },
  { methods = ["POST"], path_prefix = "/v1/images/edits" },
  # Video is async: POST /v1/videos/generations starts it, GET /v1/videos/{id}
  # polls for status (pending|done|expired|failed) and the finished URL. One
  # prefix covers both. Deliberately no DELETE.
  { methods = ["GET", "POST"], path_prefix = "/v1/videos" },
]

[services.elevenlabs]
name = "ElevenLabs"
base_url = "https://api.elevenlabs.io"
auth_in = "header"
auth_header = "xi-api-key"
signup_url = "https://elevenlabs.io/app/settings/api-keys"
endpoints = [
  { methods = ["GET"], path_prefix = "/v1/user" },
  { methods = ["GET"], path_prefix = "/v1/voices" },
  { methods = ["POST"], path_prefix = "/v1/text-to-speech" },
]

# ── Models ──────────────────────────────────────────────────────────────────

# DeepSeek is OpenAI-compatible on the wire — same Bearer header, same
# /v1/chat/completions shape — which is why the entry below mirrors OpenAI's.
# `/user/balance` is free and is the cheapest way to answer "is
# this key live?", the same reason OpenAI's /v1/models is listed.
[services.deepseek]
name = "DeepSeek"
base_url = "https://api.deepseek.com"
auth_in = "header"
auth_header = "Authorization"
auth_prefix = "Bearer "
signup_url = "https://platform.deepseek.com/api_keys"
endpoints = [
  { methods = ["GET"], path_prefix = "/models" },
  { methods = ["GET"], path_prefix = "/user/balance" },
  { methods = ["POST"], path_prefix = "/chat/completions" },
  # The versioned aliases DeepSeek also answers on, so a caller written against
  # an OpenAI SDK (which always prefixes /v1) works without a rewrite.
  { methods = ["GET"], path_prefix = "/v1/models" },
  { methods = ["POST"], path_prefix = "/v1/chat/completions" },
]

[services.openai]
name = "OpenAI"
base_url = "https://api.openai.com"
auth_in = "header"
auth_header = "Authorization"
auth_prefix = "Bearer "
signup_url = "https://platform.openai.com/api-keys"
endpoints = [
  # Free, and the cheapest way to answer "is this key live?" without spending
  # anything. Worth having for exactly the diagnosis it was missing during.
  { methods = ["GET"], path_prefix = "/v1/models" },
  { methods = ["POST"], path_prefix = "/v1/chat/completions" },
  { methods = ["POST"], path_prefix = "/v1/responses" },
  { methods = ["POST"], path_prefix = "/v1/embeddings" },
  # Image generation. Sync edits/generations draw one-off location plates and
  # thumbnails; the Batch API renders a video's panels at half price. Batch needs the
  # Files API both ways: reference images and the JSONL go up, the results come down.
  # No DELETE anywhere, so a caller can add work but never remove the org's files.
  { methods = ["POST"], path_prefix = "/v1/images" },
  { methods = ["GET", "POST"], path_prefix = "/v1/files" },
  { methods = ["GET", "POST"], path_prefix = "/v1/batches" },
  # ── NO /v1/videos HERE, AND THAT IS CURRENT AS OF 2026-10-01. ────────────
  # `sora-2` and `sora-2-pro` do still
  # appear in GET /v1/models on this key, which makes it look available — but
  # OpenAI's own deprecations page lists the Videos API, sora-2, sora-2-pro
  # and every dated snapshot of them as SHUT DOWN on 2026-09-24, with no
  # replacement named. The model listing is stale metadata, not capability.
  # An entry was written here and then removed: there is no point widening the
  # broker, let alone restarting it, for an endpoint OpenAI retired. If
  # OpenAI ships a successor, add it then, with the cost noted — video bills
  # per second of output and is the priciest SKU this key has ever reached.
]

