# ── Infrastructure ──────────────────────────────────────────────────────────
#
# 🔴 THE READ-ONLY AND READ-WRITE CLOUDFLARE TOKENS ARE SEPARATE SERVICES ON
# PURPOSE. They are the same API with very different consequences, and
# `callers` is set per service -- so an agent can be given `cloudflare` and
# never `cloudflare-rw`. Merging them would make that distinction unexpressible.

[services.cloudflare]
name = "Cloudflare API (read only)"
base_url = "https://api.cloudflare.com"
auth_in = "header"
auth_header = "Authorization"
auth_prefix = "Bearer "
signup_url = "https://dash.cloudflare.com/profile/api-tokens"
endpoints = [{ methods = ["GET"], path_prefix = "/client/v4/" }]

[services.cloudflare-rw]
name = "Cloudflare API (read write)"
base_url = "https://api.cloudflare.com"
auth_in = "header"
auth_header = "Authorization"
auth_prefix = "Bearer "
signup_url = "https://dash.cloudflare.com/profile/api-tokens"
endpoints = [
  { methods = ["GET", "POST", "PUT", "PATCH", "DELETE"], path_prefix = "/client/v4/" },
]

# 🔴 GITHUB IS GET-ONLY, AND THAT IS THE POINT. The deploy pipelines start when
# a human presses "Run workflow"; over the API that button is
# `POST /repos/{o}/{r}/actions/workflows/{id}/dispatches`. An agent that could
# POST here could press it, and the human gate would be a comment in a YAML
# file. So this entry can only read -- run status, job logs, commit statuses --
# and the token behind it should be a fine-grained one with Actions: Read-only
# for the same reason: two locks, either of which holds alone.
#
# Scoped to the one organisation. Log downloads answer with a redirect to a
# signed URL, which the forwarder hands back rather than follows.
# The Black Squid demo host's own provisioning API (list / provision /
# deprovision a demo). Not a third party: the credential is the `blacksq-demos`
# Worker's PROVISION_TOKEN secret, sent as `x-provision-token`.
#
# 🔴 IT IS HERE BECAUSE NOBODY COULD PRODUCE IT. After the 2026-09-16 purge the
# value lived only as a Worker secret, which Cloudflare never shows again, so
# the site factory's `reconcile` could not run from anywhere. The factory's
# tools/rotate-provision-token.sh mints a new one straight into the Worker and
# into this broker without displaying it.
#
# Exactly the three endpoints the factory calls, each with the one method it
# uses. `/api/demo/deprovision` does not begin with `/api/demo/provision`, so
# the two POST prefixes do not overlap.
# 🔴 WRITE ACCESS TO GITHUB, FOR DELIVERING SECRETS AND NOTHING ELSE. Separate
# from `github` (read-only) for the same reason `cloudflare-rw` is separate:
# `callers` is per service, so an agent can hold one and never the other.
#
# The two endpoints are exactly what an Actions secret needs — read the target's
# public key, then PUT the sealed value (src/push.rs). It is scoped to the one
# organisation, and a PUT anywhere but `/repos/Black-Squid/` is refused by policy
# before it is a request.
[services.github-rw]
name = "GitHub API (secrets write)"
base_url = "https://api.github.com"
auth_in = "header"
auth_header = "Authorization"
auth_prefix = "Bearer "
signup_url = "https://github.com/settings/personal-access-tokens/new"
endpoints = [
  { methods = ["GET"], path_prefix = "/repos/Black-Squid/" },
  { methods = ["PUT"], path_prefix = "/repos/Black-Squid/" },
]

[services.github]
name = "GitHub API (read only)"
base_url = "https://api.github.com"
auth_in = "header"
auth_header = "Authorization"
auth_prefix = "Bearer "
signup_url = "https://github.com/settings/personal-access-tokens/new"
endpoints = [{ methods = ["GET"], path_prefix = "/repos/Black-Squid/" }]

