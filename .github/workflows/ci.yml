name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit tests (no network, no credentials)
        run: cargo test --locked
      - name: Generated docs match the catalogue
        # skills/, .cursor/rules/, AGENTS.md, .github/copilot-instructions.md and
        # docs/ are rendered from catalogue.toml by `authinjector gen-docs`. A
        # catalogue change without regenerating them fails here.
        run: |
          cargo run --locked --quiet -- gen-docs --out .
          git diff --exit-code
