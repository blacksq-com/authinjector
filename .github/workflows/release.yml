name: Release

# Tag a version (git tag v0.3.0 && git push origin v0.3.0) and this builds
# static musl binaries for x86_64 and arm64, checksums them, attaches them to a
# GitHub Release and publishes a multi-arch image to ghcr.io.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: amd64
          - target: aarch64-unknown-linux-musl
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cross
        run: cargo install cross --locked --version 0.2.5
      - name: Build (inside Docker, images pinned in Cross.toml)
        run: cross build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          set -euo pipefail
          # No version in the name, so releases/latest/download/<name> always
          # points at the newest build.
          name="authinjector-${{ matrix.target }}"
          mkdir -p "dist/$name/systemd" "dist/bin/${{ matrix.arch }}"
          cp "target/${{ matrix.target }}/release/authinjector" "dist/$name/"
          cp "target/${{ matrix.target }}/release/authinjector" "dist/bin/${{ matrix.arch }}/"
          cp install.sh catalogue.toml keys.example.txt README.md PROTOCOL.md LICENSE.md "dist/$name/"
          cp systemd/authinjector.service systemd/authinjector.socket "dist/$name/systemd/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: tarball-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.arch }}
          path: dist/bin/${{ matrix.arch }}/authinjector
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tarball-*
          merge-multiple: true
          path: dist
      - name: Checksums
        run: cd dist && sha256sum *.tar.gz > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          generate_release_notes: true

  image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: dist/bin
      - name: Lay out binaries per architecture
        run: |
          set -euo pipefail
          for a in amd64 arm64; do mv "dist/bin/bin-$a" "dist/$a"; chmod 0755 "dist/$a/authinjector"; done
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
